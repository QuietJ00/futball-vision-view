name: Unit tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    # No video, YOLO weights or network data. Heavy runs (fetch/prepare/solve) stay local.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
      - run: ruff check .
      - name: Benchmark scorer tests
        run: PYTHONPATH="$PWD" python -B -m unittest discover -s experiments/field_benchmark
      - name: Engine unit tests
        run: PYTHONPATH="$PWD" python -B -m unittest discover -s tests
